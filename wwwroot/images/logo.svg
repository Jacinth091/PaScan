<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0052cc" />
      <stop offset="100%" stop-color="#0071e3" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <!-- Shield/Gate Background -->
  <path d="M50 5 L90 20 L90 50 C90 75 50 95 50 95 C50 95 10 75 10 50 L10 20 Z" 
        fill="url(#primaryGradient)" filter="url(#shadow)" />
        
  <!-- Scanning Line / Ray -->
  <rect x="25" y="45" width="50" height="4" rx="2" fill="#4df0ff" opacity="0.9">
    <animate attributeName="y" values="30;65;30" dur="2s" repeatCount="indefinite" />
  </rect>

  <!-- Node/Device representation -->
  <circle cx="50" cy="50" r="22" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="8 4" opacity="0.5" />
  
  <!-- Device (Smartphone/Scanner) -->
  <rect x="40" y="32" width="20" height="36" rx="4" fill="none" stroke="#ffffff" stroke-width="3" />
  <line x1="46" y1="38" x2="54" y2="38" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  <circle cx="50" cy="62" r="2" fill="#ffffff" />
</svg>